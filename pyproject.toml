[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateforge-dpt"
version = "0.1.0"
description = "Local development progress control for StateForge repositories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
stateforge-dpt = "stateforge_dpt.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stateforge_dpt"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["A", "ANN", "B", "C4", "D", "E", "F", "I", "N", "PERF", "RUF", "S", "SIM", "UP", "W"]
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "D", "S101", "S106"]
"src/stateforge_dpt/service.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["stateforge_dpt"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
